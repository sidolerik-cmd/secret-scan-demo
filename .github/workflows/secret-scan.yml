name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit difference
        id: check_diff
        run: |
          BASE=main
          DIFF_COMMITS=$(git rev-list --count HEAD ^$BASE 2>/dev/null || echo 0)
          echo "diff_commits=$DIFF_COMMITS" >> $GITHUB_OUTPUT

      - name: Run TruffleHog
        if: steps.check_diff.outputs.diff_commits != '0'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified
